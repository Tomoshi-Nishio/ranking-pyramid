<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17233b"><title>ランキングピラミッド</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;background:#f1f4fa;color:#17233b}main{max-width:850px;margin:auto;padding:18px 14px 40px}h1{font-size:clamp(24px,5vw,36px);margin:0}p{line-height:1.6}.panel{background:white;border-radius:18px;padding:18px;margin-top:15px;box-shadow:0 3px 16px #182a4710}.sub{color:#52617b;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit}button{border:1px solid #cbd4e3;border-radius:12px;background:white;padding:11px 14px;cursor:pointer;font-weight:700;color:#17233b;touch-action:manipulation}button:focus-visible,.slot:focus-visible{outline:3px solid #2269d5;outline-offset:2px}.primary{background:#2464d5;color:white;border-color:#2464d5}select,input{padding:12px;border:1px solid #b9c6d9;border-radius:10px;width:100%;background:white;color:#17233b}.tiers{display:grid;gap:10px}.tier{display:flex;justify-content:center;gap:9px}.slot{border:2px dashed #7c879680;min-height:100px;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px 5px;cursor:pointer;overflow-wrap:anywhere;touch-action:manipulation}.tier:nth-child(1) .slot{background:#f7b8bd;width:43%}.tier:nth-child(2) .slot{background:#f8d99b;width:43%}.tier:nth-child(3) .slot{background:#c7e8d0;width:32%}.slot b{font-size:12px;opacity:.7}.slot span{font-size:clamp(13px,3.5vw,19px);font-weight:800;margin-top:5px}.slot.selected{outline:4px solid #286be5;outline-offset:1px}.pool{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.pool button{min-height:65px;overflow-wrap:anywhere}.pool button.selected{background:#d7e6ff;border:3px solid #286be5}.pool button:disabled{opacity:.3}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.hidden{display:none}.status{min-height:24px;text-align:center;font-weight:700;color:#1b6b46}.footer{text-align:center;color:#66738a;font-size:12px;margin-top:20px}@media(min-width:650px){.slot{min-height:120px}.pool{grid-template-columns:repeat(3,1fr)}}@media(max-width:380px){.panel{padding:12px}.slot{min-height:88px}.tier{gap:5px}}
</style></head><body><main><header><h1>🏆 ランキングピラミッド</h1><p>班で話し合って、6つのカードを <strong>S（1つ）・A（2つ）・B（3つ）</strong> に並べよう！</p></header><section class="panel"><label for="theme"><strong>お題を選ぼう</strong></label><select id="theme"></select><div class="controls" style="margin-top:12px"><button id="customToggle">✏️ 自分でお題を作る</button><button id="reset">↻ リセット</button></div><div id="custom" class="hidden" style="margin-top:15px"><label for="title">お題</label><input id="title" placeholder="例：最強の給食"><div id="fields" class="fields"></div><button class="primary" id="apply" style="width:100%;margin-top:10px">このお題で始める</button></div></section><section class="panel"><h2 id="heading" style="text-align:center;margin-top:0"></h2><div class="tiers"><div class="tier"><button class="slot" data-slot="0" aria-label="Sランク"></button></div><div class="tier"><button class="slot" data-slot="1" aria-label="Aランク左"></button><button class="slot" data-slot="2" aria-label="Aランク右"></button></div><div class="tier"><button class="slot" data-slot="3" aria-label="Bランク左"></button><button class="slot" data-slot="4" aria-label="Bランク中央"></button><button class="slot" data-slot="5" aria-label="Bランク右"></button></div></div><p class="sub" style="text-align:center">下のカードをタップ → ピラミッドの場所をタップ。配置済みカード同士も交換できます。</p></section><section class="panel"><h3 style="margin-top:0">選択肢カード <span id="progress" class="sub"></span></h3><div class="pool" id="pool"></div></section><div class="controls" style="margin-top:14px"><button id="random" style="flex:1">🔀 ランダム配置</button><button id="done" class="primary" style="flex:1">完成！</button></div><p id="status" class="status" aria-live="polite"></p><p class="footer">各端末で独立して動作します。回答はサーバーに送信されません。</p></main><script>
(()=>{'use strict';const themes=[['最強の給食',['カレー','唐揚げ','ラーメン','ハンバーグ','揚げパン','フルーツポンチ']],['最強の能力',['瞬間移動','透明人間','空を飛ぶ','時間停止','未来予知','心を読む']],['無人島で役立つもの',['水','ナイフ','ライター','スマホ','テント','釣り竿']],['最強の外食',['焼肉','寿司','ラーメン','マクドナルド','ピザ','しゃぶしゃぶ']],['最強のお菓子',['ポテチ','グミ','チョコ','じゃがりこ','クッキー','アイス']],['最強の休日',['寝る','ゲーム','買い物','友達と遊ぶ','動画を見る','旅行']],['最強のアイス',['雪見だいふく','ガリガリ君','ピノ','パピコ','スーパーカップ','ハーゲンダッツ']],['最強の体育種目',['バレー','バスケ','バドミントン','ダンス','サッカー','ドッジボール']],['最強の動物',['ライオン','ゾウ','ゴリラ','ワニ','トラ','クマ']],['一番うれしいプレゼント',['現金','スマホ','服','お菓子','ゲーム','旅行']]];const $=s=>document.querySelector(s);let active=themes[0],slots=Array(6).fill(null),selected=null;const theme=$('#theme');themes.forEach((t,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=t[0];theme.append(o)});for(let i=0;i<6;i++){let input=document.createElement('input');input.placeholder='選択肢 '+(i+1);input.setAttribute('aria-label','選択肢 '+(i+1));$('#fields').append(input)}function reset(){slots=Array(6).fill(null);selected=null;$('#status').textContent='';render()}function render(){$('#heading').textContent=active[0];$('#progress').textContent=slots.filter(x=>x!==null).length+'/6';document.querySelectorAll('[data-slot]').forEach(el=>{let i=Number(el.dataset.slot);el.classList.toggle('selected',selected?.type==='slot'&&selected.index===i);el.replaceChildren();let b=document.createElement('b');b.textContent=i===0?'S TIER':i<=2?'A TIER':'B TIER';let v=document.createElement('span');v.textContent=slots[i]===null?'＋':active[1][slots[i]];el.append(b,v)});let pool=$('#pool');pool.replaceChildren();active[1].forEach((label,i)=>{let b=document.createElement('button');b.textContent=label;b.disabled=slots.includes(i);b.classList.toggle('selected',selected?.type==='pool'&&selected.index===i);b.onclick=()=>{selected=selected?.type==='pool'&&selected.index===i?null:{type:'pool',index:i};render()};pool.append(b)})}document.querySelectorAll('[data-slot]').forEach(el=>el.onclick=()=>{let idx=Number(el.dataset.slot);if(selected===null){if(slots[idx]!==null)selected={type:'slot',index:idx}}else if(selected.type==='pool'){if(slots[idx]!==null){$('#status').textContent='配置済みカードを選択して交換してください';return}slots[idx]=selected.index;selected=null}else{let from=selected.index;[slots[from],slots[idx]]=[slots[idx],slots[from]];selected=null}$('#status').textContent='';render()});theme.onchange=()=>{active=themes[Number(theme.value)];reset()};$('#reset').onclick=reset;$('#customToggle').onclick=()=>$('#custom').classList.toggle('hidden');$('#apply').onclick=()=>{let name=$('#title').value.trim(),values=[...$('#fields').querySelectorAll('input')].map(x=>x.value.trim());if(!name||values.some(x=>!x)){ $('#status').textContent='お題と6つの選択肢を入力してください';return}active=[name,values];theme.value='';$('#custom').classList.add('hidden');reset()};$('#random').onclick=()=>{slots=[0,1,2,3,4,5];for(let i=5;i>0;i--){let j=Math.floor(Math.random()*(i+1));[slots[i],slots[j]]=[slots[j],slots[i]]}selected=null;$('#status').textContent='';render()};$('#done').onclick=()=>{$('#status').textContent=slots.some(v=>v===null)?'6つすべて配置してください':'🎉 完成！ Sランクに選んだ理由を発表しよう！'};render()})();
</script></body></html>
